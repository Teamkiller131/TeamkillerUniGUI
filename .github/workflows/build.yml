name: Build & Test

on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
    - name: Configure
      run: cmake --preset windows-msvc-release
    - name: Build
      run: cmake --build --preset windows-msvc-release
    - name: Test
      run: ctest --preset windows-msvc-release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
        ~/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
    - name: Configure
      run: cmake --preset linux-gcc-debug
    - name: Build
      run: cmake --build --preset linux-gcc-debug
    - name: Test
      run: ctest --preset linux-gcc-debug --output-on-failure

name: Quality (clang-tidy & coverage)

on: [push, pull_request]

jobs:
  # Doc version stamps must match core/version.h. Eleven docs sat stamped "v3.16.0"
  # for multiple minor releases because nothing checked them (found by the project
  # audit); this hard gate makes that class of drift fail CI. Only x.y.z stamps that
  # name the CURRENT library are allowed in the version-stamp positions — historical
  # references (CHANGELOG, release notes) are not scanned.
  docs-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Doc stamps match core/version.h (hard gate)
      run: |
        ver=$(sed -n 's/#define UNIGUI_VERSION_STRING "\(.*\)"/\1/p' include/unigui/core/version.h)
        echo "library version: $ver"
        bad=0
        # Any explicit UniGUI version stamp in docs/ or the READMEs must equal $ver.
        # Stamps look like "TeamkillerUniGUI (v4.6.0)", "**Version 4.6.0**", "tracks
        # UniGUI **4.6.0**", or the README version badge (version-4.6.0-...). Historical
        # x.y.z references without those stamp prefixes are not scanned; the pinned
        # imgui version is whitelisted.
        for f in docs/*.md README.md README_zh.md; do
          hits=$(grep -noE "(UniGUI[^0-9]{0,20}|Version[^0-9A-Za-z][^0-9]{0,4}|version-)[0-9]+\.[0-9]+\.[0-9]+" "$f" || true)
          while IFS= read -r h; do
            [ -z "$h" ] && continue
            v=$(echo "$h" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
            if [ "$v" != "$ver" ] && [ "$v" != "1.92.8" ]; then
              echo "::error file=$f::stale version stamp: $h (library is $ver)"
              bad=1
            fi
          done <<< "$hits"
        done
        exit $bad

  clang-tidy:
    runs-on: ubuntu-latest
    # Hard gate on the bug-catching family: `.clang-tidy` sets
    # `WarningsAsErrors: 'bugprone-*'`, so clang-tidy exits non-zero (and this job
    # fails) on any new bugprone finding. The other enabled families
    # (readability/modernize/performance/cppcoreguidelines/misc) stay advisory —
    # reported in the log but non-fatal — because the tree carries thousands of
    # deliberate style deviations that are not bugs. There is no continue-on-error
    # anymore; a bugprone regression must fail CI.
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update
        # Pin clang-tidy-19: the runner's default clang-tidy is an older clang whose
        # frontend cannot parse libstdc++'s C++23 <expected> (used by core/error.h since
        # 4.0), producing 3 spurious clang-diagnostic-errors ("no template named
        # 'expected' in namespace 'std'") that make the lint exit non-zero even though
        # GCC compiles the code fine.
        sudo apt-get install -y ninja-build clang-tidy-19 \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
        ~/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
    - name: Configure (export compile_commands.json)
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=~/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DUNIGUI_BACKEND_DX11=OFF -DUNIGUI_BACKEND_DX12=OFF
    - name: Build (generates the embedded-font header; populates compile DB)
      # clang-tidy needs generated headers (e.g. the embedded JetBrains Mono font
      # consumed by theme.cc) to exist, so build the library first.
      run: cmake --build build --target unigui
    - name: Run clang-tidy
      run: |
        # Lint only the library TUs that are actually compiled in *this*
        # configuration, read from compile_commands.json. This excludes
        # off-module / off-backend sources (config, network, ipc, dx11/dx12,
        # sdl3, vulkan, trading, …) whose third-party headers aren't installed
        # here — linting those with bogus default flags produced spurious
        # `file not found` clang-diagnostic-errors that failed the job.
        python3 -c "import json; print('\n'.join(e['file'] for e in json.load(open('build/compile_commands.json')) if '/src/' in e['file'] and e['file'].endswith('.cc')))" > tidy_files.txt
        clang-tidy-19 --version
        echo "Linting $(wc -l < tidy_files.txt) compiled first-party sources"
        # --extra-arg forces C++23 for the frontend regardless of how the compile DB
        # records the standard, so <expected> is available. Style warnings are advisory;
        # a bugprone-* finding (WarningsAsErrors in .clang-tidy) or a real
        # clang-diagnostic-error makes clang-tidy exit non-zero and fails the step.
        xargs clang-tidy-19 -p build --config-file=.clang-tidy --extra-arg=-std=gnu++23 < tidy_files.txt
    - name: Wrapper coverage vs ImGui (advisory)
      # Reports the first-class-wrapped %% of ImGui's practical surface (the
      # "Wrapper coverage" success metric in DEVELOPMENT_PLAN.md). Advisory for
      # now; the trend should move up, never down. Once stable, add
      # `--threshold N` to turn it into a hard regression gate.
      run: |
        python3 scripts/coverage_vs_imgui.py \
          --imgui build/vcpkg_installed/x64-linux/include/imgui.h --list

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lcov \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
        ~/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
    - name: Configure (gcov instrumentation)
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=~/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fno-inline" -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
          -DUNIGUI_BACKEND_DX11=OFF -DUNIGUI_BACKEND_DX12=OFF
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure || true  # headless GL failures expected
    - name: Collect coverage
      run: |
        lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov || true
        lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' \
          --output-file coverage.info --ignore-errors unused || true
        lcov --list coverage.info || true
    - name: Coverage floor (advisory)
      # Advisory for now (mirrors the clang-tidy gate above): prints total line
      # coverage and compares it to a floor, but does not fail the build yet —
      # headless CI skips GL-dependent tests, so the measured number is a lower
      # bound. Once the headless baseline is confirmed stable, raise
      # COVERAGE_FLOOR to just under it and replace the warning with `exit 1` to
      # turn this into a hard regression gate.
      env:
        COVERAGE_FLOOR: "30"
      run: |
        summary="$(lcov --summary coverage.info 2>/dev/null || true)"
        echo "$summary"
        pct="$(printf '%s\n' "$summary" | grep -oP 'lines\.*:\s*\K[0-9.]+' | head -1)"
        if [ -z "$pct" ]; then
          echo "::warning::Could not determine line coverage (no data?)"
          exit 0
        fi
        echo "Total line coverage: ${pct}% (floor: ${COVERAGE_FLOOR}%)"
        if awk "BEGIN{exit !(${pct} < ${COVERAGE_FLOOR})}"; then
          echo "::warning::Line coverage ${pct}% is below the ${COVERAGE_FLOOR}% floor (advisory — not failing the build yet)"
        else
          echo "Line coverage ${pct}% meets the ${COVERAGE_FLOOR}% floor."
        fi
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: coverage.info
        if-no-files-found: ignore

name: Quality (clang-tidy & coverage)

on: [push, pull_request]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    # Advisory for now: clang-tidy findings are reported but don't block the
    # pipeline. Flip to a hard gate (remove continue-on-error) once the
    # baseline is clean.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang-tidy \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
        ~/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
    - name: Configure (export compile_commands.json)
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=~/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DUNIGUI_BACKEND_DX11=OFF -DUNIGUI_BACKEND_DX12=OFF
    - name: Run clang-tidy
      run: |
        # Lint only first-party sources; skip generated/vcpkg paths.
        find src -name '*.cc' | xargs clang-tidy -p build --config-file=.clang-tidy
    - name: Wrapper coverage vs ImGui (advisory)
      # Reports the first-class-wrapped %% of ImGui's practical surface (the
      # "Wrapper coverage" success metric in DEVELOPMENT_PLAN.md). Advisory for
      # now; the trend should move up, never down. Once stable, add
      # `--threshold N` to turn it into a hard regression gate.
      run: |
        python3 scripts/coverage_vs_imgui.py \
          --imgui build/vcpkg_installed/x64-linux/include/imgui.h --list

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lcov \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-common-dev
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
        ~/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
    - name: Configure (gcov instrumentation)
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=~/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fno-inline" -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
          -DUNIGUI_BACKEND_DX11=OFF -DUNIGUI_BACKEND_DX12=OFF
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure || true  # headless GL failures expected
    - name: Collect coverage
      run: |
        lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov || true
        lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' \
          --output-file coverage.info --ignore-errors unused || true
        lcov --list coverage.info || true
    - name: Coverage floor (advisory)
      # Advisory for now (mirrors the clang-tidy gate above): prints total line
      # coverage and compares it to a floor, but does not fail the build yet —
      # headless CI skips GL-dependent tests, so the measured number is a lower
      # bound. Once the headless baseline is confirmed stable, raise
      # COVERAGE_FLOOR to just under it and replace the warning with `exit 1` to
      # turn this into a hard regression gate.
      env:
        COVERAGE_FLOOR: "30"
      run: |
        summary="$(lcov --summary coverage.info 2>/dev/null || true)"
        echo "$summary"
        pct="$(printf '%s\n' "$summary" | grep -oP 'lines\.*:\s*\K[0-9.]+' | head -1)"
        if [ -z "$pct" ]; then
          echo "::warning::Could not determine line coverage (no data?)"
          exit 0
        fi
        echo "Total line coverage: ${pct}% (floor: ${COVERAGE_FLOOR}%)"
        if awk "BEGIN{exit !(${pct} < ${COVERAGE_FLOOR})}"; then
          echo "::warning::Line coverage ${pct}% is below the ${COVERAGE_FLOOR}% floor (advisory — not failing the build yet)"
        else
          echo "Line coverage ${pct}% meets the ${COVERAGE_FLOOR}% floor."
        fi
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: coverage.info
        if-no-files-found: ignore
